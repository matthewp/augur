# Every push and pull request: the release tarball (meson dist builds and
# tests it), the .debs and the FreeBSD packages, each built and tested on
# the system it's for. A tag vX.Y.Z also makes the GitHub release, with
# all of them attached, and then the AUR's augur-dbus
# (build-aux/aur/publish.sh, with the key in the AUR_SSH_KEY secret) and
# the FreeBSD repository on pkg.gemwm.org (build-aux/freebsd/publish.sh,
# with the signing key and R2's in secrets).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends meson pkgconf \
            libglib2.0-dev libjson-glib-dev libsoup-3.0-dev \
            libglib2.0-bin dbus-bin dbus-daemon python3
      - run: meson setup build
      - run: meson dist -C build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: build/meson-dist/*.tar.xz

  deb:
    strategy:
      fail-fast: false
      matrix:
        system:
          - { image: 'debian:bookworm', name: debian12 }
          - { image: 'debian:trixie', name: debian13 }
          - { image: 'ubuntu:noble', name: ubuntu24.04 }
        arch:
          - { runner: ubuntu-24.04, name: amd64 }
          - { runner: ubuntu-24.04-arm, name: arm64 }
    runs-on: ${{ matrix.arch.runner }}
    container: ${{ matrix.system.image }}
    steps:
      - uses: actions/checkout@v4
      - run: build-aux/build-deb.sh debs
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.system.name }}-${{ matrix.arch.name }}
          path: debs/*.deb

  freebsd:
    strategy:
      fail-fast: false
      matrix:
        release: ['14.5', '15.1']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in FreeBSD ${{ matrix.release }}
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          usesh: true
          run: build-aux/freebsd/build-pkg.sh pkgs
      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-${{ matrix.release }}
          path: pkgs/*.pkg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dist, deb, freebsd]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the version
        run: |
          version=$(sed -n "s/^\tversion: '\(.*\)',/\1/p" meson.build)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag is $GITHUB_REF_NAME but meson.build says $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: cd out && sha256sum * > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Augur ${GITHUB_REF_NAME#v}" --generate-notes

  aur:
    needs: release
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Publish augur-dbus
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: build-aux/aur/publish.sh "${GITHUB_REF_NAME#v}"

  freebsd-publish:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        release: ['14.5', '15.1']
    runs-on: ubuntu-24.04
    env:
      PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: gemwm-pkg
    steps:
      # Not set up yet is no failure: the release has the packages anyway.
      - if: env.PKG_SIGNING_KEY == ''
        run: echo "::warning::PKG_SIGNING_KEY isn't set; not published to pkg.gemwm.org"
      - if: env.PKG_SIGNING_KEY != ''
        uses: actions/checkout@v4
      - if: env.PKG_SIGNING_KEY != ''
        uses: actions/download-artifact@v4
        with:
          name: freebsd-${{ matrix.release }}
          path: pkgs
      - name: Publish in FreeBSD ${{ matrix.release }}
        if: env.PKG_SIGNING_KEY != ''
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          usesh: true
          envs: 'PKG_SIGNING_KEY R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET'
          run: build-aux/freebsd/publish.sh pkgs/*.pkg
